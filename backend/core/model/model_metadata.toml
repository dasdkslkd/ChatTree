zai_glm = "https://docs.z.ai/guides/llm/glm-5.2"
zai_model_switch = "https://docs.z.ai/devpack/latest-model"

[[rules]]
id = "openai-gpt-5.5"
name_patterns = ["^gpt-5\\.5(?:-.+)?$"]
api_formats = ["responses", "chat_completions"]
context_length = 1000000
supports_vision = true
reasoning_effort = { levels = ["low", "medium", "high", "xhigh"], default = "medium" }

