# 模型能力元数据
#
# 数据来源优先级：官方模型/定价/迁移文档，其次为供应商官方集成示例。
# 只在这里维护模型能力；业务代码只负责加载和匹配。

[sources]
openai = "https://developers.openai.com/api/docs/models"
anthropic_models = "https://docs.anthropic.com/en/docs/about-claude/models/overview"
anthropic_migration = "https://docs.anthropic.com/en/docs/about-claude/models/migrating-to-claude-5"
