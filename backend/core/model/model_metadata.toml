# 模型能力元数据
#
# 此文件是 Server Home/model_metadata.toml 的首次初始化模板；运行时只读取
# Server Home 副本，因此可单独替换该副本完成免安装更新。
# 数据来源优先级：官方模型/定价/迁移文档，其次为供应商官方集成示例。
# 只在这里维护模型能力；业务代码只负责加载和匹配。

[sources]
openai = "https://developers.openai.com/api/docs/models"
anthropic_models = "https://docs.anthropic.com/en/docs/about-claude/models/overview"
anthropic_migration = "https://docs.anthropic.com/en/docs/about-claude/models/migrating-to-claude-5"
gemini = "https://ai.google.dev/gemini-api/docs/models"
qwen = "https://www.alibabacloud.com/help/en/model-studio/models"
deepseek = "https://api-docs.deepseek.com/quick_start/pricing"
zai_glm = "https://docs.z.ai/guides/llm/glm-5.2"
zai_model_switch = "https://docs.z.ai/devpack/latest-model"

[reasoning_profiles.openai_responses_native]
carrier = "responses_items"
history_policy = "provider_state"
strict = true
controls = { context = "all_turns", include_encrypted_content = true, summary = "auto" }

[reasoning_profiles.anthropic_thinking]
carrier = "anthropic_blocks"
history_policy = "provider_state"
strict = true

[reasoning_profiles.gemini_signed_thought]
carrier = "gemini_signature"
history_policy = "provider_state"
strict = true

[reasoning_profiles.kimi_preserved_all]
carrier = "chat_reasoning_content"
history_policy = "all_assistant_messages"
strict = true
controls = { effort_field = "reasoning_effort" }

[reasoning_profiles.kimi_k26]
carrier = "chat_reasoning_content"
history_policy = "all_assistant_messages"
strict = true
controls = { thinking_style = "kimi_keep" }

[reasoning_profiles.deepseek_tool_reasoning]
carrier = "chat_reasoning_content"
history_policy = "tool_assistant_messages"
strict = true
controls = { thinking_style = "type", effort_field = "reasoning_effort" }

[reasoning_profiles.mimo_tool_reasoning]
carrier = "chat_reasoning_content"
history_policy = "tool_assistant_messages"
strict = true
controls = { thinking_style = "mimo" }

[reasoning_profiles.zai_preserved]
carrier = "chat_reasoning_content"
history_policy = "all_assistant_messages"
strict = true
controls = { thinking_style = "zai", effort_field = "reasoning_effort" }

[reasoning_profiles.qwen_chat_display_only]
carrier = "chat_reasoning_content"
history_policy = "drop"
strict = false
controls = { thinking_style = "qwen" }

[reasoning_profiles.qwen_preserved_all]
carrier = "chat_reasoning_content"
history_policy = "all_assistant_messages"
strict = true

[[rules]]
id = "openai-gpt-5.6"
name_patterns = ["^gpt-5\\.6(?:-.+)?$"]
protocol = "openai_responses"
endpoint = "/responses"
reasoning_profile = "openai_responses_native"
context_length = 1000000
supports_vision = true
reasoning_effort = { levels = ["low", "medium", "high", "xhigh", "max"], default = "medium" }

