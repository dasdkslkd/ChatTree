<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatTree</title>
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <div class="tab-bar" id="tabBar">
    <button class="new-tab-btn" id="newTabBtn" title="新建标签页 (Ctrl+T)">+</button>
  </div>
  <div class="content-area" id="contentArea">
    <div class="navigator" id="navigator">
      <h1>选择服务器</h1>
      <div class="nav-section">
        <div class="nav-section-title">本地</div>
        <div class="nav-card" id="localCard">
          <div class="icon">L</div>
          <div class="info">
            <div class="title">Local Server</div>
            <div class="subtitle">连接本机 chattree-server</div>
          </div>
          <div class="arrow">&rsaquo;</div>
        </div>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">SSH 远程主机</div>
        <div id="sshHostsList"></div>
      </div>
    </div>
    <div class="overlay" id="overlay">
      <div class="spinner"></div>
      <div class="title" id="overlayTitle"></div>
      <div class="subtitle" id="overlaySubtitle"></div>
      <button class="retry-btn" id="overlayRetry" style="display:none;">重试</button>
    </div>
  </div>
  <script src="shell.js"></script>
</body>
</html>
