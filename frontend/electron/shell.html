<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatTree</title>
  <style>
    :root {
      --background: #100e0c;
      --foreground: #fbf7f4;
      --card: #1c1917;
      --primary: #d97757;
      --primary-foreground: #fff5ef;
      --secondary: #2a2723;
      --muted: #2a2723;
      --muted-foreground: rgba(251,247,244,0.52);
      --accent: rgba(217,119,87,0.14);
      --accent-foreground: #fbf7f4;
      --border: rgba(255,247,240,0.09);
      --accent-green: #5fb98a;
      --accent-red: #e8705f;
      --accent-yellow: #e8c45a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--background); color: var(--foreground); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Tab bar */
    .tab-bar { display: flex; align-items: center; background: var(--card); border-bottom: 1px solid var(--border); padding: 0 8px; height: 40px; flex-shrink: 0; gap: 2px; }
    .tab { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 30px; border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; background: transparent; color: var(--muted-foreground); user-select: none; border: 1px solid transparent; transition: background 0.15s, color 0.15s; }
    .tab:hover { background: var(--secondary); color: var(--foreground); }
    .tab.active { background: var(--background); color: var(--foreground); border-color: var(--border); }
    .tab .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .tab .status-dot.disconnected { background: var(--muted-foreground); }
    .tab .status-dot.connecting { background: var(--accent-yellow); animation: pulse 1s infinite; }
    .tab .status-dot.ready { background: var(--accent-green); }
    .tab .status-dot.error { background: var(--accent-red); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .tab .close-btn { display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 4px; border: none; background: transparent; color: var(--muted-foreground); cursor: pointer; font-size: 15px; line-height: 1; }
    .tab .close-btn:hover { background: var(--border); color: var(--accent-red); }
    .new-tab-btn { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; border: none; background: transparent; color: var(--muted-foreground); cursor: pointer; font-size: 18px; flex-shrink: 0; transition: background 0.15s, color 0.15s; }
    .new-tab-btn:hover { background: var(--accent); color: var(--primary); }

    /* Content area */
    .content-area { flex: 1; position: relative; overflow: hidden; background: var(--background); }

    /* Navigator page */
    .navigator { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 60px 24px; height: 100%; overflow-y: auto; }
    .navigator h1 { font-size: 22px; font-weight: 600; margin-bottom: 32px; color: var(--foreground); }
    .nav-section { width: 100%; max-width: 480px; margin-bottom: 28px; }
    .nav-section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-foreground); margin-bottom: 10px; padding-left: 4px; }
    .nav-card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: border-color 0.15s, background 0.15s; margin-bottom: 8px; }
    .nav-card:hover { border-color: var(--primary); background: var(--secondary); }
    .nav-card .icon { width: 36px; height: 36px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--primary); flex-shrink: 0; }
    .nav-card .info { flex: 1; min-width: 0; }
    .nav-card .title { font-size: 14px; font-weight: 500; color: var(--foreground); }
    .nav-card .subtitle { font-size: 12px; color: var(--muted-foreground); margin-top: 2px; }
    .nav-card .arrow { color: var(--muted-foreground); font-size: 16px; }
    .nav-empty { color: var(--muted-foreground); font-size: 13px; padding: 8px 4px; }

    /* Overlay (connecting / error) */
    .overlay { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 14px; color: var(--foreground); }
    .overlay .spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--secondary); border-top-color: var(--primary); animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .overlay .title { font-size: 15px; font-weight: 500; }
    .overlay .subtitle { font-size: 13px; color: var(--muted-foreground); max-width: 480px; text-align: center; word-break: break-word; }
    .overlay.error .spinner { display: none; }
    .overlay.error .title { color: var(--accent-red); }
    .overlay.error .retry-btn { margin-top: 8px; padding: 6px 16px; border-radius: 6px; border: 1px solid var(--border); background: var(--secondary); color: var(--foreground); cursor: pointer; font-size: 13px; }
    .overlay.error .retry-btn:hover { border-color: var(--primary); color: var(--primary); }
  </style>
</head>
<body>
  <div class="tab-bar" id="tabBar">
    <button class="new-tab-btn" id="newTabBtn" title="新建标签页">+</button>
  </div>
  <div class="content-area" id="contentArea">
    <div class="navigator" id="navigator">
      <h1>选择服务器</h1>
      <div class="nav-section">
        <div class="nav-section-title">本地</div>
        <div class="nav-card" id="localCard">
          <div class="icon">L</div>
          <div class="info">
            <div class="title">Local Server</div>
            <div class="subtitle">连接本机 chattree-server</div>
          </div>
          <div class="arrow">&rsaquo;</div>
        </div>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">SSH 远程主机</div>
        <div id="sshHostsList"></div>
      </div>
    </div>
    <div class="overlay" id="overlay">
      <div class="spinner"></div>
      <div class="title" id="overlayTitle"></div>
      <div class="subtitle" id="overlaySubtitle"></div>
      <button class="retry-btn" id="overlayRetry" style="display:none;">重试</button>
    </div>
  </div>

  <script>
    const tabBar = document.getElementById("tabBar");
    const newTabBtn = document.getElementById("newTabBtn");
    const navigator = document.getElementById("navigator");
    const contentArea = document.getElementById("contentArea");
    const localCard = document.getElementById("localCard");
    const sshHostsList = document.getElementById("sshHostsList");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlaySubtitle = document.getElementById("overlaySubtitle");
    const overlayRetry = document.getElementById("overlayRetry");

    let tabs = [];
    let activeTabId = null;

    function renderOverlay() {
      const active = tabs.find(t => t.id === activeTabId);
      if (!active || active.status === "ready" || active.status === "disconnected") {
        overlay.style.display = "none";
        overlay.classList.remove("error");
        overlayRetry.style.display = "none";
        return;
      }
      if (active.status === "connecting") {
        overlay.classList.remove("error");
        overlayRetry.style.display = "none";
        overlayTitle.textContent = `正在连接 ${active.label}…`;
        overlaySubtitle.textContent = "正在建立 SSH 隧道并握手，请稍候";
        overlay.style.display = "flex";
      } else if (active.status === "error") {
        overlay.classList.add("error");
        overlayTitle.textContent = `连接失败：${active.label}`;
        overlaySubtitle.textContent = active.error || "未知错误";
        overlayRetry.style.display = "inline-block";
        overlay.style.display = "flex";
      }
    }

    function renderTabs() {
      tabBar.querySelectorAll(".tab").forEach(el => el.remove());
      tabs.forEach(tab => {
        const el = document.createElement("div");
        el.className = "tab" + (tab.id === activeTabId ? " active" : "");
        el.title = tab.label + " — " + tab.status + (tab.error ? " — " + tab.error : "");

        const dot = document.createElement("span");
        dot.className = "status-dot " + tab.status;
        el.appendChild(dot);

        const label = document.createElement("span");
        label.textContent = tab.label;
        el.appendChild(label);

        const closeBtn = document.createElement("button");
        closeBtn.className = "close-btn";
        closeBtn.textContent = "×";
        closeBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          window.electronAPI.closeTab(tab.id);
        });
        el.appendChild(closeBtn);

        el.addEventListener("click", () => {
          window.electronAPI.switchTab(tab.id);
        });

        tabBar.insertBefore(el, newTabBtn);
      });

      if (activeTabId === null) {
        navigator.style.display = "flex";
        overlay.style.display = "none";
      } else {
        navigator.style.display = "none";
        renderOverlay();
      }
    }

    function renderSshHosts(hosts) {
      sshHostsList.innerHTML = "";
      if (!hosts || hosts.length === 0) {
        const empty = document.createElement("div");
        empty.className = "nav-empty";
        empty.textContent = "未配置 SSH 主机（在设置中添加）";
        sshHostsList.appendChild(empty);
        return;
      }
      hosts.forEach(host => {
        const card = document.createElement("div");
        card.className = "nav-card";
        card.innerHTML = `
          <div class="icon">S</div>
          <div class="info">
            <div class="title">${host}</div>
            <div class="subtitle">SSH 远程连接</div>
          </div>
          <div class="arrow">&rsaquo;</div>
        `;
        card.addEventListener("click", () => {
          window.electronAPI.connectSshHost(host);
        });
        sshHostsList.appendChild(card);
      });
    }

    async function loadNavigatorData() {
      if (!window.electronAPI) return;
      try {
        const data = await window.electronAPI.getNavigatorData();
        renderSshHosts(data.sshHosts || []);
      } catch (e) {
        console.error("Failed to load navigator data:", e);
      }
    }

    localCard.addEventListener("click", () => {
      if (!window.electronAPI) return;
      window.electronAPI.connectLocal();
    });

    newTabBtn.addEventListener("click", () => {
      if (window.electronAPI) {
        window.electronAPI.showNavigator();
      } else {
        navigator.style.display = "flex";
      }
    });

    overlayRetry.addEventListener("click", async () => {
      const active = tabs.find(t => t.id === activeTabId);
      if (!active) return;
      const { kind, alias } = active;
      await window.electronAPI.closeTab(active.id);
      if (kind === "local") {
        window.electronAPI.connectLocal();
      } else if (kind === "ssh" && alias) {
        window.electronAPI.connectSshHost(alias);
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      if (window.electronAPI) {
        window.electronAPI.onTabsUpdated((updatedTabs, activeId) => {
          tabs = updatedTabs;
          activeTabId = activeId;
          renderTabs();
        });
        renderTabs();
        loadNavigatorData();
      }
    });
  </script>
</body>
</html>
